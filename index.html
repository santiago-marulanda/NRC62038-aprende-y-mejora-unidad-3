<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>7 Torques | Ingeniería de Precisión para Motocicletas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#111316",
                        "inverse-primary": "#a04100",
                        "error-container": "#93000a",
                        "on-surface-variant": "#e2bfb0",
                        "primary-container": "#ff6b00",
                        "secondary-fixed": "#ffdbcc",
                        "on-primary": "#561f00",
                        "on-error-container": "#ffdad6",
                        "on-secondary": "#561f00",
                        "on-surface": "#e2e2e6",
                        "on-background": "#e2e2e6",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#9ccaff",
                        "on-secondary-container": "#ffa173",
                        "surface-variant": "#333538",
                        "primary-fixed": "#ffdbcc",
                        "on-primary-container": "#572000",
                        "surface-bright": "#37393d",
                        "surface-tint": "#ffb693",
                        "on-tertiary-fixed": "#001d35",
                        "on-primary-fixed": "#351000",
                        "outline": "#a98a7d",
                        "on-tertiary": "#003257",
                        "inverse-surface": "#e2e2e6",
                        "surface-container-high": "#282a2d",
                        "on-primary-fixed-variant": "#7a3000",
                        "error": "#ffb4ab",
                        "tertiary": "#9ccaff",
                        "on-tertiary-container": "#003357",
                        "on-tertiary-fixed-variant": "#00497b",
                        "secondary-fixed-dim": "#ffb693",
                        "background": "#111316",
                        "tertiary-container": "#059eff",
                        "surface-container-lowest": "#0c0e11",
                        "on-secondary-fixed-variant": "#783207",
                        "tertiary-fixed": "#d0e4ff",
                        "surface": "#111316",
                        "surface-container": "#1e2023",
                        "surface-container-low": "#1a1c1f",
                        "inverse-on-surface": "#2f3034",
                        "primary-fixed-dim": "#ffb693",
                        "secondary": "#ffb693",
                        "primary": "#ffb693",
                        "outline-variant": "#5a4136",
                        "surface-container-highest": "#333538",
                        "secondary-container": "#7b3409",
                        "on-secondary-fixed": "#351000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #111316; color: #e2e2e6; }
        .font-headline { font-family: 'Space Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { background: rgba(51, 53, 56, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="selection:bg-primary-container selection:text-on-primary-container bg-surface text-on-surface">

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-50 glass-panel border-b border-outline-variant/15">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" class="flex items-center space-x-2 group">
        <span class="font-headline text-2xl font-black tracking-tighter text-primary group-hover:text-primary-container transition-colors">
          7 TORQUES
        </span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="#servicios" class="font-body text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors tracking-wide">SERVICIOS</a>
        <a href="#nosotros" class="font-body text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors tracking-wide">NOSOTROS</a>
        <a href="#contacto" class="font-body text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors tracking-wide">CONTACTO</a>
        
        <a href="#agendar" class="font-headline text-sm font-bold px-6 py-2.5 rounded-lg bg-gradient-to-br from-primary-container to-primary text-on-primary-container shadow-lg shadow-primary-container/20 hover:scale-105 active:scale-95 transition-all">
          AGENDAR CITA
        </a>
      </nav>

      <!-- Mobile Menu Button -->
      <button id="mobile-menu-button" class="md:hidden p-2 text-primary">
        <span class="material-symbols-outlined text-3xl">menu</span>
      </button>
    </div>

    <!-- Mobile Navigation Overlay -->
    <div id="mobile-menu" class="hidden md:hidden absolute top-20 left-0 w-full bg-surface-container-high/95 backdrop-blur-xl border-t border-outline-variant/15 py-8 px-6 shadow-2xl">
      <nav class="flex flex-col space-y-6 text-center">
        <a href="#servicios" class="mobile-nav-link font-headline text-lg font-bold text-on-surface">SERVICIOS</a>
        <a href="#nosotros" class="mobile-nav-link font-headline text-lg font-bold text-on-surface">NOSOTROS</a>
        <a href="#contacto" class="mobile-nav-link font-headline text-lg font-bold text-on-surface">CONTACTO</a>
        <a href="#agendar" class="font-headline text-lg font-bold py-4 rounded-lg bg-primary-container text-on-primary-container">
          AGENDAR CITA
        </a>
      </nav>
    </div>
  </header>

  <main class="pt-32 px-6">
    <p class="py-12 border-b border-outline-variant/10">secciones Dani</p>
    <p class="py-12 border-b border-outline-variant/10">secciones Mario</p>
    <p class="py-12">secciones Santi</p>
  </main>

  <script>
    // Mobile Menu Toggle logic
    const menuBtn = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = menuBtn.querySelector('span');

    menuBtn.addEventListener('click', () => {
      const isHidden = mobileMenu.classList.contains('hidden');
      if (isHidden) {
        mobileMenu.classList.remove('hidden');
        menuIcon.textContent = 'close';
      } else {
        mobileMenu.classList.add('hidden');
        menuIcon.textContent = 'menu';
      }
    });

    // Close menu on link click
    document.querySelectorAll('.mobile-nav-link').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        menuIcon.textContent = 'menu';
      });
    });
  </script>
</body>
</html>
